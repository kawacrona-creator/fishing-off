<style>
/* Layout concept: Tennis Off style. Top = search + event list; detail with apply form; organizer post form; organizer pricing; my page. */
:root{
  --bg:#EDF3F4; --surface:#FFFFFF; --fg:#0F2A33; --muted:#5B7078; --line:#D2DEE1;
  --accent:#0B7A75; --accent-fg:#FFFFFF; --accent-soft:#DCEFEE; --float:#F2B705; --float-fg:#3A2E00;
  --warn:#B4452B; --ok:#1E7A46;
  --font-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A20; --surface:#12262E; --fg:#E4EEF0; --muted:#8FA6AD; --line:#25404A;
    --accent:#3FC1B8; --accent-fg:#06201E; --accent-soft:#143A3C; --float:#E8B923; --float-fg:#2B2200;
    --warn:#F08A6E; --ok:#6CD39A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A20; --surface:#12262E; --fg:#E4EEF0; --muted:#8FA6AD; --line:#25404A;
  --accent:#3FC1B8; --accent-fg:#06201E; --accent-soft:#143A3C; --float:#E8B923; --float-fg:#2B2200;
  --warn:#F08A6E; --ok:#6CD39A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);line-height:1.35;margin:0;text-wrap:balance}
.wrap{max-width:880px;margin:0 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding-block:8px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);font-family:var(--font-display);font-weight:900;font-size:19px}
.logo svg{width:30px;height:30px;color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
nav a{color:var(--fg);text-decoration:none;font-size:13.5px;font-weight:500;padding:6px 10px;border-radius:6px}
nav a:hover{background:var(--accent-soft)}
nav a[aria-current="page"]{color:var(--accent);font-weight:700}
nav a.cta{background:var(--accent);color:var(--accent-fg);font-weight:700}

/* landing */
.landing-hero{background:var(--accent);color:var(--accent-fg);border-radius:16px;padding:0;margin-top:20px;position:relative;overflow:hidden}
.landing-hero h1{font-size:clamp(24px,5vw,36px);font-weight:900;line-height:1.3;color:#fff}
.landing-hero p{color:rgba(255,255,255,.8);margin:12px 0 0;max-width:28em;font-size:15px;line-height:1.8}
.landing-hero .btn-row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.landing-hero .btn-w{font:inherit;font-size:15px;font-weight:700;border:none;border-radius:8px;padding:12px 28px;cursor:pointer;text-decoration:none;display:inline-block}
.landing-hero .btn-w.primary{background:#fff;color:var(--accent)}
.landing-hero .btn-w.ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
.hero-img{width:100%;display:block;border-radius:16px 16px 0 0;max-height:340px;object-fit:cover;object-position:center 20%}
.hero-content{padding:28px 28px 36px}
.landing-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
@media(max-width:560px){.landing-stats{grid-template-columns:repeat(2,1fr)}}
.lstat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 10px;text-align:center}
.lstat .n{font-family:var(--font-display);font-size:clamp(22px,4vw,32px);font-weight:900;color:var(--accent);line-height:1}
.lstat .l{font-size:12px;color:var(--muted);margin-top:6px;font-weight:500}
.landing-how{margin-top:28px}
.landing-how h2{font-size:20px;font-weight:900;margin-bottom:16px}
.how-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.how-steps{grid-template-columns:1fr}}
.how-step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 16px}
.how-step .num{font-family:var(--font-display);font-size:36px;font-weight:900;color:var(--accent-soft);line-height:1;margin-bottom:8px}
.how-step h3{font-size:16px;font-weight:700;margin-bottom:4px}
.how-step p{color:var(--muted);font-size:13px;margin:0;line-height:1.7}
.landing-types{margin-top:28px}
.landing-types h2{font-size:20px;font-weight:900;margin-bottom:16px}
.ltypes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:560px){.ltypes{grid-template-columns:repeat(3,1fr)}}
.ltype{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;text-decoration:none;color:inherit}
.ltype:hover{border-color:var(--accent)}
.ltype .icon{font-size:28px;line-height:1;margin-bottom:6px}
.ltype .name{font-family:var(--font-display);font-size:13px;font-weight:700}
.landing-recent{margin-top:28px}
.landing-recent h2{font-size:20px;font-weight:900;margin-bottom:16px}
.landing-cta{margin-top:32px;text-align:center;padding:32px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.landing-cta h2{font-size:20px;font-weight:900;margin-bottom:8px}
.landing-cta p{color:var(--muted);margin:0 auto 20px;max-width:28em}

/* hero + search */
.hero{padding-block:28px 8px}
.hero h1{font-size:clamp(25px,6vw,38px);font-weight:900;letter-spacing:.01em}
.hero p{color:var(--muted);margin:10px 0 0;max-width:34em}
.search{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:20px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.search .full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px}
.toggle input{width:auto}

/* list */
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 12px}
.listhead h2{font-size:19px}
.count{color:var(--muted);font-size:13px}
.events{display:grid;gap:12px}
.card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:inherit}
.card:hover{border-color:var(--accent)}
.date{border-radius:8px;background:var(--accent-soft);text-align:center;padding:8px 0;height:max-content;font-variant-numeric:tabular-nums}
.date .m{font-size:11px;font-weight:700;color:var(--muted)}
.date .d{font-family:var(--font-display);font-size:26px;font-weight:900;line-height:1.1}
.date .w{font-size:12px;font-weight:700}
.date .w.sat{color:#2A6FB5}.date .w.sun{color:var(--warn)}
.card h3{font-size:16.5px;margin:6px 0 4px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 8px;background:var(--bg);border:1px solid var(--line)}
.badge.lv{background:var(--float);border-color:var(--float);color:var(--float-fg)}
.meta{color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 14px}
.spots{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.bar{flex:1;max-width:160px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.spots b.full{color:var(--warn)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted)}

.maprow{display:flex;gap:12px;align-items:flex-start}
.pin{flex:none;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.pin svg{width:24px;height:24px}
/* buttons */
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 20px;background:var(--accent);color:var(--accent-fg);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}

/* detail */
.back{display:inline-block;margin:18px 0 8px;font-size:14px}
.detail{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h2{font-size:17px;margin-bottom:10px}
.detail h1{font-size:clamp(22px,5vw,30px);font-weight:900;margin:8px 0}
dl.kv{display:grid;grid-template-columns:7em minmax(0,1fr);gap:8px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px;font-weight:700;padding-top:2px}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.org{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:900;font-family:var(--font-display);flex:none}
.form{display:grid;gap:12px}
.note{font-size:12.5px;color:var(--muted)}
.ok{border-color:var(--ok);background:var(--surface)}
.ok h2{color:var(--ok)}
.err{color:var(--warn);font-size:13px;font-weight:700;min-height:1.2em}

/* auth forms */
.auth-wrap{max-width:420px;margin:0 auto;padding-top:24px}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;margin-top:16px}
.auth-card h1{font-size:22px;font-weight:900;text-align:center;margin-bottom:4px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:20px}
.auth-card .form{display:grid;gap:14px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px}
.auth-card .divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px}
.auth-card .divider::before,.auth-card .divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.auth-card .social-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.auth-card .social-btn:hover{border-color:var(--accent)}
.auth-card .social-btn svg{width:18px;height:18px;flex:none}
.auth-footer{text-align:center;margin:16px 0 0;font-size:14px}
.profile-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.profile-header{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:900;font-family:var(--font-display);font-size:24px;flex:none}
.profile-info h2{font-size:18px;margin:0 0 2px}
.profile-info p{color:var(--muted);font-size:13px;margin:0}
.profile-edit{display:grid;gap:12px;margin-top:12px;padding-top:16px;border-top:1px solid var(--line)}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pstat{background:var(--bg);border-radius:10px;padding:14px 10px;text-align:center}
.pstat .n{font-family:var(--font-display);font-size:24px;font-weight:900;color:var(--accent);line-height:1}
.pstat .l{font-size:11px;color:var(--muted);margin-top:4px}

/* organizers */
.plans{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:16px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:10px;align-content:start}
.plan.pro{border:2px solid var(--accent)}
.price{font-family:var(--font-display);font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.price small{font-size:14px;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding-left:1.2em}
.plan li{margin:3px 0}
.flow{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
.flow li{counter-increment:s;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.flow li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:900;display:grid;place-items:center;font-size:14px}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer{margin-top:40px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:16px}
.sample{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
@media (max-width:420px){.card{grid-template-columns:54px minmax(0,1fr);gap:10px}dl.kv{grid-template-columns:6em minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<script>
/* ---------- Supabase 認証 ---------- */
var currentUser=null;
var _authReady=false;
var _supabase=null;
try{
  _supabase = window.supabase.createClient(
    'https://ltqsmfzrwqluylgzxpbt.supabase.co',
    'sb_publishable_44qx2s3Nmbg2H-g-F8xotQ_kx7xTuBg'
  );
}catch(e){console.error("Supabase初期化エラー:",e)}

/* セッション復元 */
async function initAuth(){
  if(!_supabase){_authReady=true;updateAuthUI();route();return}
  const {data:{session}}=await _supabase.auth.getSession();
  if(session){
    const u=session.user;
    currentUser={
      id:u.id,
      email:u.email,
      name:u.user_metadata?.name||u.email.split("@")[0],
      joined:(u.created_at||"").slice(0,10),
      bio:u.user_metadata?.bio||""
    };
  }
  _authReady=true;
  updateAuthUI();
  route();
}

/* 認証状態の変化を監視 */
if(_supabase) _supabase.auth.onAuthStateChange((event,session)=>{
  if(session){
    const u=session.user;
    currentUser={
      id:u.id,
      email:u.email,
      name:u.user_metadata?.name||u.email.split("@")[0],
      joined:(u.created_at||"").slice(0,10),
      bio:u.user_metadata?.bio||""
    };
  } else {
    currentUser=null;
  }
  if(_authReady){updateAuthUI();route()}
});

async function logout(){
  if(_supabase) await _supabase.auth.signOut();
  currentUser=null;
  updateAuthUI();
  route();
}
function updateAuthUI(){
  const nav=document.getElementById("nav");if(!nav)return;
  const old=document.getElementById("auth-nav");if(old)old.remove();
  const span=document.createElement("span");span.id="auth-nav";span.style.display="flex";span.style.alignItems="center";span.style.gap="6px";
  if(currentUser){
    const initial=(currentUser.name||currentUser.email||"?").charAt(0).toUpperCase();
    span.innerHTML=`<a href="#my" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg);padding:4px 8px;border-radius:8px" id="user-menu-btn"><span style="width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:900;font-size:13px;font-family:var(--font-display)">${esc(initial)}</span><span style="font-size:12px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(currentUser.name||currentUser.email)}</span></a>`;
    nav.appendChild(span);
  } else {
    span.innerHTML=`<a href="#login" style="font-size:13px;padding:7px 14px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:8px;font-weight:500">ログイン</a><a href="#signup" style="font-size:13px;padding:7px 14px;text-decoration:none;background:var(--accent);color:var(--accent-fg);border-radius:8px;font-weight:700">新規登録</a>`;
    nav.appendChild(span);
  }
}
</script>

/* --- Supabase DB helpers --- */
let _dbEvents=[];  // DBから取得したイベント
let _dbApps={};    // event_id -> [{name,experience,message}]
async function loadEvents(){
  if(!_supabase)return;
  try{
    const {data,error}=await _supabase.from("events").select("*").order("date",{ascending:true});
    if(error){console.error("events取得エラー:",error);return}
    _dbEvents=(data||[]).map(r=>({
      id:r.id, user_id:r.user_id, title:r.title, type:r.type, area:r.area, place:r.place,
      mapUrl:r.map_url||"", date:r.date, time:r.time, end:r.end_time||"",
      fish:r.fish||"", level:r.level, fee:r.fee||0, cap:r.cap||6, joined:0,
      org:r.org, rental:!!r.rental, access:r.access||[], items:r.items||"特になし",
      desc:r.description||"", fromDB:true
    }));
  }catch(e){console.error("events取得例外:",e)}
}
async function loadApplications(){
  if(!_supabase)return;
  try{
    const {data,error}=await _supabase.from("applications").select("*");
    if(error){console.error("applications取得エラー:",error);return}
    _dbApps={};
    (data||[]).forEach(r=>{
      if(!_dbApps[r.event_id])_dbApps[r.event_id]=[];
      _dbApps[r.event_id].push({name:r.name,exp:r.experience,msg:r.message||"",at:new Date(r.created_at).getTime(),user_id:r.user_id});
    });
  }catch(e){console.error("applications取得例外:",e)}
}
async function loadAllData(){await Promise.all([loadEvents(),loadApplications()])}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const MAPHOSTS=/^(www\.google\.com|google\.com|maps\.google\.com|www\.google\.co\.jp|maps\.google\.co\.jp|maps\.app\.goo\.gl|goo\.gl|maps\.apple\.com|map\.yahoo\.co\.jp|www\.openstreetmap\.org)$/;
/* 空なら ""、読み取れなければ null、読めたらURLを返す。共有テキストや埋め込みコードを丸ごと貼っても拾う */
function parseMap(raw){
  raw=(raw||"").trim();if(!raw)return "";
  const m=raw.match(/src\s*=\s*["']([^"']+)["']/i);if(m)raw=m[1].replace(/&amp;/g,"&");
  const u=raw.match(/https?:\/\/[^\s"'<>]+/);if(!u)return null;
  try{const x=new URL(u[0]);return MAPHOSTS.test(x.hostname)?x.href:null}catch(e){return null}
}
const mapLink=e=>e.mapUrl||"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e.place);
const WD=["日","月","火","水","木","金","土"];
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function events(){
  return SAMPLE.concat(S.posted).concat(_dbEvents).map(e=>{
    const localApps=(S.applied[e.id]||[]).length;
    const dbApps=(_dbApps[e.id]||[]).length;
    return {...e,area:LEGACY[e.area]??e.area,access:e.access||ACC[e.id]||[],joined:(e.fromDB?0:e.joined)+localApps+dbApps};
  }).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
const byId=id=>events().find(e=>e.id===id);
function dateBlock(e){const d=pd(e.date),w=d.getDay();
  return `<div class="date"><div class="m">${d.getMonth()+1}月</div><div class="d">${d.getDate()}</div><div class="w ${w===6?"sat":w===0?"sun":""}">${WD[w]}</div></div>`}
function spotsHtml(e){const left=e.cap-e.joined;
  return `<div class="spots"><span>${left>0?`残り<b>${left}</b>名`:`<b class="full">満員</b>`}</span><span class="bar"><i style="width:${Math.min(100,e.joined/e.cap*100)}%"></i></span><span>${e.joined}/${e.cap}名</span></div>`}
function card(e){
  return `<a class="card" href="#event-${esc(e.id)}">${dateBlock(e)}<div style="min-width:0">
    <div class="badges"><span class="badge">${esc(e.type)}</span><span class="badge lv">${esc(e.level)}</span>${e.id[0]==="s"?'<span class="sample">サンプル</span>':""}</div>
    <h3>${esc(e.title)}</h3>
    <div class="meta"><span>${esc(e.time)}集合</span><span>${esc(e.area?e.area+" / ":"")}${esc(e.place)}</span></div>
    <div class="meta"><span>対象: ${esc(e.fish||"指定なし")}</span><span>参加費 ${yen(e.fee)}</span></div>
    <div class="meta"><span>集合手段: ${e.access.length?e.access.map(esc).join("・"):"指定なし"}</span></div>
    ${spotsHtml(e)}</div></a>`}

function viewHome(){
  $app.innerHTML=`
  <section class="hero">
    <h1>次の週末、一緒に竿を出す仲間を見つけよう。</h1>
    <p>堤防、船、ルアー、管理釣り場。エリアと日付から、近くで開かれる釣行を探せます。1人で行くのが不安な初心者も歓迎です。</p>

      <label class="f" for="level">レベル<select id="level"><option value="">すべて</option>${LEVELS.map(a=>`<option ${F.level===a?"selected":""}>${a}</option>`).join("")}</select></label>
      <label class="f" for="acc">集合手段<select id="acc"><option value="">すべて</option>${TRANSPORT.map(a=>`<option ${F.acc===a?"selected":""}>${a}</option>`).join("")}</select></label>
      <div class="full"><div class="f" style="margin-bottom:6px">釣り方</div><div class="chips" id="types">${["すべて",...TYPES].map(t=>`<button type="button" class="chip" data-t="${t==="すべて"?"":t}" aria-pressed="${(F.type||"")===(t==="すべて"?"":t)}">${t}</button>`).join("")}</div></div>
      <label class="toggle full" for="open"><input id="open" type="checkbox" ${F.open?"checked":""}>空きがある釣行だけ表示</label>
    </div>
  </section>
  <div class="listhead"><h2>開催予定の釣行</h2><span class="count" id="count"></span></div>
  <div class="events" id="events"></div>`;
  const upd=()=>{
    const q=F.q.trim().toLowerCase();
    const list=events().filter(e=>
      (!q||[e.title,e.fish,e.place,e.type,e.area].join(" ").toLowerCase().includes(q))&&
      (!F.area||e.area===F.area)&&(!F.level||e.level===F.level)&&(!F.type||e.type===F.type)&&(!F.acc||e.access.includes(F.acc))&&(!F.open||e.cap>e.joined));
    $("count").textContent=list.length+"件";
    $("events").innerHTML=list.length?list.map(card).join(""):`<div class="empty">条件に合う釣行がありません。条件をゆるめるか、自分で募集を作ってみてください。<br><a href="#post">募集を作る</a></div>`;
  };
  $("q").oninput=e=>{F.q=e.target.value;upd()};
  $("area").onchange=e=>{F.area=e.target.value;upd()};
  $("level").onchange=e=>{F.level=e.target.value;upd()};
  $("acc").onchange=e=>{F.acc=e.target.value;upd()};
  $("open").onchange=e=>{F.open=e.target.checked;upd()};
  $("types").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;F.type=b.dataset.t;
    [...$("types").children].forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.t===F.type)));upd()};
  upd();
}

      items:v("pit")||"特になし",desc:v("pds")||"詳しくは当日お伝えします。"};
    /* Supabaseに保存を試みる */
    if(_supabase && currentUser){

    }};

          <h2>${esc(currentUser.name||"名前未設定")}</h2>
          <p>${esc(currentUser.email)}</p>
          <p style="font-size:12px;margin-top:2px">登録日: ${joinedDate}</p>
        </div>
      </div>
      <div class="profile-stats">
        <div class="pstat"><div class="n">${applied.length}</div><div class="l">参加希望</div></div>
        <div class="pstat"><div class="n">${mine.length}</div><div class="l">主催した釣行</div></div>
        <div class="pstat"><div class="n">${Object.values(S.applied).reduce((a,b)=>a+b.length,0)}</div><div class="l">申し込み数</div></div>
      </div>
      <details>
        <summary style="cursor:pointer;font-size:14px;font-weight:700;color:var(--accent)">プロフィールを編集</summary>
        <div class="profile-edit">
          <label class="f" for="my-name">ニックネーム<input id="my-name" maxlength="30" value="${esc(currentUser.name||"")}"></label>
          <label class="f" for="my-bio">自己紹介<textarea id="my-bio" maxlength="200" rows="3" placeholder="例: 横浜在住。週末はサビキ釣りをしています。初心者です。">${esc(currentUser.bio||"")}</textarea></label>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="btn" id="save-profile" type="button" style="font-size:14px;padding:8px 20px">保存</button>
            <span class="note" id="save-msg"></span>
          </div>
        </div>
      </details>
    </div>
  </section>
  <div class="listhead"><h2>参加を希望した釣行</h2><span class="count">${applied.length}件</span></div>
  <div class="events">${applied.length?applied.map(card).join(""):`<div class="empty">まだ参加を希望した釣行はありません。<br><a href="#home">釣行を探す</a></div>`}</div>
  <div class="listhead"><h2>自分が作った募集</h2><span class="count">${mine.length}件</span></div>
  <div class="events">${mine.length?mine.map(m=>card(byId(m.id))).join(""):`<div class="empty">まだ募集を作っていません。<br><a href="#post">募集を作る</a></div>`}</div>
  <div style="margin-top:28px;display:flex;gap:12px;flex-wrap:wrap">
    <button class="btn danger" id="clr" type="button">保存したデータを消す</button>
    <button class="btn ghost" id="logout-my" type="button">ログアウト</button>
    <span class="note" id="clrmsg" style="align-self:center"></span>
  </div>`;
  $("save-profile").onclick=async()=>{
    const newName=$("my-name").value.trim();
    const newBio=$("my-bio").value.trim();
    if(!newName){$("save-msg").textContent="ニックネームを入力してください。";return}
    $("save-profile").disabled=true;$("save-profile").textContent="保存中…";
    const {error}=await _supabase.auth.updateUser({data:{name:newName,bio:newBio}});
    $("save-profile").disabled=false;$("save-profile").textContent="保存";
    if(error){$("save-msg").innerHTML=`<span style="color:var(--warn)">保存に失敗しました</span>`;return}
    currentUser.name=newName;currentUser.bio=newBio;
    updateAuthUI();
    $("save-msg").innerHTML=`<span style="color:var(--ok)">保存しました</span>`;
    setTimeout(()=>{if($("save-msg"))$("save-msg").textContent=""},2000);
  };
  $("logout-my").onclick=()=>logout();
  let armed=false;
  $("clr").onclick=()=>{
    if(!armed){armed=true;$("clr").textContent="もう一度押すと、申し込みと募集をすべて消します";return}
    S={posted:[],applied:{}};save();viewMy()};
}

/* ---------- login / signup（会員機能）---------- */
function pwField(id,label,auto,placeholder){
  return `<label class="f" for="${id}">${label}<div class="pw-wrap"><input id="${id}" type="password" autocomplete="${auto}" minlength="6" placeholder="${placeholder}"><button type="button" class="pw-toggle" data-for="${id}" aria-label="パスワードを表示">表示</button></div></label>`;
}
function initPwToggles(){
  document.querySelectorAll(".pw-toggle").forEach(btn=>{
    btn.onclick=()=>{const inp=$(btn.dataset.for);
      if(inp.type==="password"){inp.type="text";btn.textContent="隠す"}
      else{inp.type="password";btn.textContent="表示"}};
  });
}

function viewLogin(){
  $app.innerHTML=`
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>ログイン</h1>
      <p class="sub">フィッシングオフにログインして釣り仲間を見つけよう</p>
      <form class="form" id="lf" novalidate>
        <label class="f" for="le">メールアドレス<input id="le" type="email" autocomplete="email" placeholder="example@mail.com"></label>
        ${pwField("lp","パスワード","current-password","パスワードを入力")}
        <label class="toggle" style="font-size:13px"><input id="lremember" type="checkbox" checked>ログイン状態を保持する</label>
        <div class="err" id="lerr" role="alert"></div>
        <button class="btn" type="submit" style="width:100%">ログイン</button>
      </form>
      <div class="divider">または</div>
      <button class="social-btn" id="g-login" type="button">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Googleでログイン
      </button>
      <p class="auth-footer">アカウントをお持ちでない方は <a href="#signup">新規登録</a></p>
    </div>
    <p class="note" style="text-align:center;margin-top:12px">※ Googleログインは今後対応予定です。</p>
  </div>`;
  initPwToggles();
  $("g-login").onclick=()=>{$("lerr").textContent="Googleログインは今後対応予定です。メールアドレスで登録してください。"};
  $("lf").onsubmit=async ev=>{ev.preventDefault();
    const email=$("le").value.trim(),pw=$("lp").value;
    if(!email||!pw){$("lerr").textContent="メールアドレスとパスワードを入力してください。";return}
    const btn=ev.target.querySelector('button[type="submit"]');
    btn.disabled=true;btn.textContent="ログイン中…";
    const {error}=await _supabase.auth.signInWithPassword({email,password:pw});
    if(error){
      btn.disabled=false;btn.textContent="ログイン";
      if(error.message.includes("Invalid login")){$("lerr").textContent="メールアドレスまたはパスワードが正しくありません。"}
      else if(error.message.includes("Email not confirmed")){$("lerr").textContent="メールアドレスの確認が完了していません。受信トレイを確認してください。"}
      else{$("lerr").textContent="ログインに失敗しました: "+error.message}
      return;
    }
    updateAuthUI();location.hash="my"};
}

function viewSignup(){
  $app.innerHTML=`
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>新規登録</h1>
      <p class="sub">無料でアカウントを作成して、釣り仲間を見つけよう</p>
      <form class="form" id="sf" novalidate>
        <label class="f" for="sn">ニックネーム<input id="sn" maxlength="30" autocomplete="nickname" placeholder="例: 海斗"></label>
        <label class="f" for="se">メールアドレス<input id="se" type="email" autocomplete="email" placeholder="example@mail.com"></label>
        ${pwField("sp","パスワード","new-password","6文字以上で入力")}
        ${pwField("sp2","パスワード(確認)","new-password","もう一度入力")}
        <div id="pw-str" style="font-size:12px;min-height:1.2em"></div>
        <div class="err" id="serr" role="alert"></div>
        <button class="btn" type="submit" style="width:100%">アカウントを作成</button>
      </form>
      <div class="divider">または</div>
      <button class="social-btn" id="g-signup" type="button">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Googleで登録
      </button>
      <p class="auth-footer">すでにアカウントをお持ちの方は <a href="#login">ログイン</a></p>
    </div>
    <p class="note" style="text-align:center;margin-top:12px">※ 登録後、確認メールが届きます。リンクをクリックしてからログインしてください。</p>
  </div>`;
  initPwToggles();
  $("g-signup").onclick=()=>{$("serr").textContent="Googleログインは今後対応予定です。メールアドレスで登録してください。"};
  $("sp").oninput=()=>{const pw=$("sp").value;const el=$("pw-str");
    if(!pw){el.textContent="";return}
    const s=(pw.length>=8?1:0)+(/[A-Z]/.test(pw)?1:0)+(/[0-9]/.test(pw)?1:0)+(/[^A-Za-z0-9]/.test(pw)?1:0);
    const labels=["弱い","やや弱い","普通","強い"];const colors=["var(--warn)","#e8a020","var(--muted)","var(--ok)"];
    el.innerHTML=`パスワード強度: <span style="color:${colors[Math.min(s,3)]};font-weight:700">${labels[Math.min(s,3)]}</span>`;};
  $("sf").onsubmit=async ev=>{ev.preventDefault();
    const name=$("sn").value.trim(),email=$("se").value.trim(),pw=$("sp").value,pw2=$("sp2").value;
    if(!name){$("serr").textContent="ニックネームを入力してください。";$("sn").focus();return}
    if(!email){$("serr").textContent="メールアドレスを入力してください。";$("se").focus();return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$("serr").textContent="メールアドレスの形式が正しくありません。";$("se").focus();return}
    if(pw.length<6){$("serr").textContent="パスワードは6文字以上にしてください。";$("sp").focus();return}
    if(pw!==pw2){$("serr").textContent="パスワードが一致しません。";$("sp2").focus();return}
    const btn=ev.target.querySelector('button[type="submit"]');
    btn.disabled=true;btn.textContent="登録中…";
    const {data,error}=await _supabase.auth.signUp({
      email,password:pw,
      options:{data:{name,bio:""}}
    });
    if(error){
      btn.disabled=false;btn.textContent="アカウントを作成";
      if(error.message.includes("already registered")){$("serr").textContent="このメールアドレスはすでに登録されています。"}
      else{$("serr").textContent="登録に失敗しました: "+error.message}
      return;
    }
    /* メール確認が必要な場合 */
    if(data.user&&!data.session){
      btn.disabled=false;btn.textContent="アカウントを作成";
      $("serr").innerHTML=`<span style="color:var(--ok)">確認メールを送信しました！<br>メールのリンクをクリックしてからログインしてください。</span>`;
      return;
    }
    updateAuthUI();location.hash="my"};
}

/* ---------- router ---------- */
const $=id=>document.getElementById(id);
const $app=$("app");
function route(){
  const h=location.hash.slice(1)||"landing";
  let r=h;
  if(h.startsWith("event-")){viewEvent(h.slice(6));r="home"}
  else if(h==="login"){viewLogin();r="login"}
  else if(h==="signup"){viewSignup();r="signup"}
  else if(h==="post"){
    if(!currentUser){location.hash="login";return}
    viewPost();
  }
  else if(h==="organizers")viewOrganizers();
  else if(h==="my")viewMy();
  else if(h==="home"){viewHome();r="home"}
  else if(h==="landing"){viewLanding();r="landing"}
  else{viewLanding();r="landing"}
  document.querySelectorAll("#nav a").forEach(a=>{
    if(a.dataset.r===r&&!a.classList.contains("cta"))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  updateAuthUI();
  window.scrollTo({top:0});
}
window.addEventListener("hashchange",route);
initAuth();
</script>
